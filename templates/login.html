{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="relative z-10 flex justify-center items-center min-h-screen -mt-10">
  <div class="bg-gray-900/90 shadow-2xl rounded-2xl p-10 w-full max-w-md border border-gray-800 backdrop-blur-lg">
    <h2 class="text-3xl font-extrabold text-center text-blue-400 mb-6">Welcome Back</h2>
    <p class="text-center text-gray-400 mb-8">Sign in to continue to your account</p>

    {% if error %}
      <p class="text-red-400 text-center bg-red-900/40 border border-red-600 py-2 rounded-lg mb-4">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
      <div>
        <label class="block mb-1 text-gray-300 font-medium">Email</label>
        <input type="email" name="email" required placeholder="you@example.com"
          class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block mb-1 text-gray-300 font-medium">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block mb-1 text-gray-300 font-medium">Role</label>
        <select name="role"
          class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white focus:ring-2 focus:ring-blue-500">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Sign In
      </button>
    </form>

    <p class="text-center mt-6 text-sm text-gray-400">
      No account?
      <a href="{{ url_for('register') }}" class="text-blue-400 font-medium hover:underline">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
